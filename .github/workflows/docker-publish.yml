name: Docker Build & Publish

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

env:
  GOTOOLCHAIN: local
  REGISTRY: ghcr.io
  # 包名固定为 fwalizer（与 AGENTS.md §十 镜像命名一致）；owner 动态取自仓库，fork 后仍可用
  IMAGE_NAME: ${{ github.repository_owner }}/fwalizer

jobs:
  docker:
    runs-on: ubuntu-latest
    # 包含依赖准备、检查、镜像构建与推送的 job 总预算。
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 Go 环境
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          # v6 起默认改用 go.mod；显式保留原有 go.sum 缓存依据。
          cache-dependency-path: go.sum

      - name: 更新所有 SDK 到最新版
        run: |
          go get -u github.com/tencentcloud/tencentcloud-sdk-go/tencentcloud/common
          go get -u github.com/tencentcloud/tencentcloud-sdk-go/tencentcloud/lighthouse
          go get -u github.com/tencentcloud/tencentcloud-sdk-go/tencentcloud/vpc
          go get -u github.com/alibabacloud-go/swas-open-20200601/v3
          go get -u github.com/alibabacloud-go/ecs-20140526/v7
          go get -u github.com/alibabacloud-go/darabonba-openapi/v2
          go get -u github.com/aliyun/credentials-go
          go mod tidy

      - name: 设置 Node.js
        uses: actions/setup-node@v7
        with:
          # 固定到具体补丁版本，与 build/Dockerfile 的 node:24.21-alpine 保持一致
          node-version: '24.21.0'
          # 运行时升级不同时引入新版 Action 的自动 npm 缓存。
          package-manager-cache: false

      - name: 构建前端
        run: cd webui/frontend && npm ci && npm run build

      - name: 前端行为回归
        run: cd webui/frontend && npm test

      # 依赖审计门禁（Build6 Step 6）：两层均阻断。
      # 生产依赖审计只统计会进入发布链路的生产依赖；完整审计覆盖 devDependency 构建链；
      # 二者在 Step 6 升级后均为 0 漏洞，故都作为阻断项，失败即阻止后续镜像构建与推送。
      - name: 前端依赖审计（生产依赖，阻断）
        run: cd webui/frontend && npm audit --omit=dev --audit-level=high

      - name: 前端依赖审计（完整，阻断）
        run: cd webui/frontend && npm audit --audit-level=high

      - name: 编译检查
        run: |
          go build -v ./...
          go vet ./...

      # 带标签的真实上游测试只编译，不在默认 CI 访问外网 DNS。
      - name: 编译真实 DNS 测试（不执行）
        timeout-minutes: 5
        run: go test -tags=dnsintegration -run '^$' ./dns

      - name: 运行测试
        # 步骤预算包含编译与所有包；-timeout 仅限制每个包的测试二进制。
        timeout-minutes: 15
        run: go test -race -v -timeout=5m ./...

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 ghcr.io
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取 Docker 元数据
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=pr

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          file: build/Dockerfile
          push: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
