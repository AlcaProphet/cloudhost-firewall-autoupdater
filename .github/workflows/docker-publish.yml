name: Docker Build & Publish

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  # 包名固定为 fwalizer（与 AGENTS.md §十 镜像命名一致）；owner 动态取自仓库，fork 后仍可用
  IMAGE_NAME: ${{ github.repository_owner }}/fwalizer

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: 更新所有 SDK 到最新版
        run: |
          go get -u github.com/tencentcloud/tencentcloud-sdk-go/tencentcloud/common
          go get -u github.com/tencentcloud/tencentcloud-sdk-go/tencentcloud/lighthouse
          go get -u github.com/tencentcloud/tencentcloud-sdk-go/tencentcloud/vpc
          go get -u github.com/alibabacloud-go/swas-open-20200601/v3
          go get -u github.com/alibabacloud-go/ecs-20140526/v7
          go get -u github.com/alibabacloud-go/darabonba-openapi/v2
          go get -u github.com/aliyun/credentials-go
          go mod tidy

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 构建前端
        run: cd webui/frontend && npm ci && npm run build

      - name: 编译检查
        run: |
          go build -v ./...
          go vet ./...

      - name: 运行测试
        run: go test -race -v ./...

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取 Docker 元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=pr

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v5
        env:
          BUILD_VERSION: ${{ github.ref_name }}
        with:
          context: .
          file: build/Dockerfile
          push: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
          platforms: linux/amd64
          build-args: |
            VERSION=${{ env.BUILD_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
